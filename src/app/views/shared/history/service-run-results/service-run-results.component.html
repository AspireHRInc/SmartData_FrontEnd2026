<kendo-dialog title="Results" (close)="close()" [minWidth]="250" [width]="500">
  <div *ngIf="loading" class="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <ul class="results" *ngIf="!loading && results?.length > 0">
    <li class="result" *ngFor="let result of results">
      <label>{{ result.label }}</label>
      <button
        *ngIf="result.type === 'file'"
        kendoButton
        icon="download"
        (click)="onButtonClick(result.filePath)"
        class="button primary result-button"
      >
        {{ result.fileName }}
      </button>

      <p *ngIf="result.type === 'text' || result.type === 'info' || result.type === 'parameter'" class="result-text">
        {{ result.textResult }}
      </p>
    </li>
  </ul>
  <p *ngIf="!loading && (!results || results.length === 0) && !error">No results available.</p>
</kendo-dialog>
