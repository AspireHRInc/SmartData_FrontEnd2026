<div class="logo">
  <!-- <img src="src/assets/images/logos/AspireLogo-Menu.png" alt="AspireHR" /> -->
  <!-- <img src="../../../assets/images/logos/AspireLogo-Menu.png" alt="AspireHR" /> -->
</div>
<nav>
  <div class="area" *ngFor="let area of navigationItems">
    <div class="title">
      <span class="material-icons-outlined">{{ area.icon }}</span>
      <a [routerLink]="area.url">{{ area.title }}</a>
    </div>
    <div *ngIf="area.items" class="items">
      <div *ngFor="let item of area.items">
        <a [routerLink]="item.url">{{ item.display }}</a>
        <div *ngIf="item.notifications > 0" class="notifications">{{ item.notifications }}</div>
      </div>
    </div>
  </div>
</nav>
