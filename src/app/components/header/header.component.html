
<header class="header" *ngIf="type === 'dashboard'">
  <img src="../../../assets/images/logos/logo-aspire-light.svg" alt="Aspire Logo" class="background" />
  <div class="content-wrapper">
    <div class="nav-left">
      <a
        class="home-link"
        (click)="goHome($event)"
        (keyup)="keyGoHome($event)"
        role="button"
        arial-label="Go Home"
        tabindex="0"
      >
        <ss-icon-logo-light></ss-icon-logo-light>
      </a>
    </div>
    <div class="text">
      <h1 class="title">{{ headerTitle }}</h1>
      <h2 class="subtitle">{{ headerSubtitle }}</h2>
    </div>
    <div class="user-actions">
      <button
        class="user-icon-button"
        aria-label="user profile"
        tabindex="0"
      >
        <span class="k-icon k-i-user"></span>
      </button>
      <button
        class="logout-icon-button"
        aria-label="logout"
        (click)="logout()"
        tabindex="0"
      >
        <span class="k-icon k-i-logout"></span>
      </button>
    </div>
  </div>
</header>

<header class="header detail" *ngIf="type === 'serviceDetail' || type === 'admin'" style="position: relative;">
  <img src="../../../assets/images/logos/logo-aspire-light.svg" alt="Aspire Logo" class="background" style="position: fixed; width: 1400px; top: -150px; left: 45%; opacity: 0.1; pointer-events: none; z-index: 0;" />
  <div class="content-wrapper" style="display: flex; align-items: center; width: 100%; position: relative; z-index: 1;">
    <div class="nav-left" style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 0.5rem; z-index: 2;">
      <a
        class="home-link"
        (click)="goHome($event)"
        (keyup)="keyGoHome($event)"
        role="button"
        arial-label="Go Home"
        tabindex="0"
      >
        <ss-icon-logo-light></ss-icon-logo-light>
      </a>
      <button
        class="back-button"
        aria-label="navigate back"
        (click)="back($event)"
        (keyup)="back($event)"
        tabindex="0"
        style="background: none; border: none; box-shadow: none; color: white; cursor: pointer; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;"
      >
        <span class="k-icon k-i-arrow-left"></span>
      </button>
    </div>
    <div class="text" style="width: 100%; text-align: center; padding: 1.5rem 0;">
      <h1 class="title" style="color: white; font-weight: 700; font-size: 1.5625rem; line-height: 125%; text-shadow: 0 2px 6px rgba(0,0,0,0.3); margin: 0;">{{ headerTitle }}</h1>
    </div>
    <div class="user-actions" style="position: fixed; top: 1.5rem; right: 1.5rem; display: flex; align-items: center; gap: 0.5rem; z-index: 100;">
      <button
        class="user-icon-button"
        aria-label="user profile"
        tabindex="0"
        style="background: none; border: none; cursor: pointer; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;"
      >
        <span class="k-icon k-i-user" style="color: white; font-size: 1.4rem;"></span>
      </button>
      <button
        class="logout-icon-button"
        aria-label="logout"
        (click)="logout()"
        tabindex="0"
        style="background: none; border: none; cursor: pointer; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;"
      >
        <span class="k-icon k-i-logout" style="color: white; font-size: 1.4rem;"></span>
      </button>
    </div>
  </div>
</header>
