<kendo-window
  title="Insights"
  *ngIf="this.uiState.serviceFiltersOpen$ | async"
  (close)="close()"
  [width]="width"
  [top]="top"
  [left]="left"
  [draggable]="false"
  [@slideInOut]
  class="window"
>
  <kendo-window-titlebar>
    <div class="k-window-title"><h2 class="title">Insights</h2></div>
    <button kendoWindowCloseAction aria-label="close"></button>
  </kendo-window-titlebar>

  <div class="insights-container">
    <!-- Quick Stats -->
    <fieldset class="fieldset stats">
      <legend class="name">Today's Stats</legend>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-value">{{ totalRunsToday }}</div>
          <div class="stat-label">Total Runs</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">{{ successRate }}%</div>
          <div class="stat-label">Success Rate</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">{{ failedRuns }}</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">{{ averageDuration | number: '1.1-1' }}h</div>
          <div class="stat-label">Avg Duration</div>
        </div>
      </div>
    </fieldset>

    <!-- Recently Used -->
    <fieldset class="fieldset recent">
      <legend class="name">Recently Used</legend>
      <div class="recent-list">
        <div
          class="recent-item"
          *ngFor="let run of recentlyUsed; trackBy: trackByRunId"
          (click)="quickAccess(run)"
        >
          <div class="recent-name">{{ run.serviceName }}</div>
          <div class="recent-status" [style.color]="run.status[0] === 'Completed' ? 'var(--color-cta)' : 'var(--color-accent-6)'">
            {{ run.status[0] }}
          </div>
          <div class="recent-time">{{ run.submittedDate | date: 'short' }}</div>
        </div>
        <div *ngIf="recentlyUsed.length === 0" class="empty-state">
          No recent runs
        </div>
      </div>
    </fieldset>
  </div>

  <div class="k-actions k-actions-end buttons">
    <button kendoButton type="button" class="button close" (click)="close()" tabindex="0">Close</button>
  </div>
</kendo-window>
