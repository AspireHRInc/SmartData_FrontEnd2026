name: Deploy SmartSuite

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '*.md'
      - '.devcontainer/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production
        run: npx ng build --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.AWS_ACCESS_KEY_ID_PROD || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.AWS_SECRET_ACCESS_KEY_PROD || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync to S3
        run: aws s3 sync dist/smart-suite/ s3://${{ github.ref == 'refs/heads/main' && 'smartdata-frontend-prod' || 'smartdata-frontend-nonprod' }}/ --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ github.ref == 'refs/heads/main' && 'E3HQYZ7L17LXV1' || 'ELZ7Z4MD60FWW' }} --paths "/*"
        env:
          AWS_DEFAULT_REGION: us-east-1