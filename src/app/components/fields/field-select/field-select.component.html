<div
  kendoTooltip
  class="right"
  position="right"
  [title]="parameters.HelpText"
  [tooltipTemplate]="template"
  tooltipClass="tool-tip"
  showOn="none"
  [offset]="25"
  #anchor
>
  <kendo-label class="label" [text]="parameters.Caption" [formGroup]="formGroup">
    <button class="info" [tabindex]="tabindex" (click)="toggleToolTip(anchor)">?</button>
    <kendo-dropdownlist
      [data]="parameters.Options"
      textField="Plabel"
      valueField="Pvalue"
      [defaultItem]="{ text: parameters.DefaultValue, value: null }"
      [(ngModel)]="selectedItem"
      [formControlName]="parameters.ParameterName"
      [required]="parameters.Required"
      fillMode="flat"
      size="large"
      [valuePrimitive]="false"
      [tabIndex]="tabindex + 1"
      (focus)="showToolTip(anchor)"
      (blur)="hideToolTip(anchor)"
    ></kendo-dropdownlist>
  </kendo-label>
</div>
<ng-template #template let-anchor>
  <span>{{ parameters.HelpText }}</span>
</ng-template>
