<header class="header" *ngIf="type === 'dashboard'">
  <img src="../../../assets/images/logos/logo-aspire-multicolor.png" alt="Aspire Logo" class="background" [style.animation-delay]="logoAnimationDelay" />
  <div class="content-wrapper">
    <div class="nav-left">
      <a
        class="home-link"
        (click)="goHome($event)"
        (keyup)="keyGoHome($event)"
        role="button"
        arial-label="Go Home"
        tabindex="0"
      >
        <ss-icon-logo-dark></ss-icon-logo-dark>
      </a>
    </div>
    <div class="text">
      <h1 class="title">{{ headerTitle }}</h1>
      <h2 class="subtitle">{{ headerSubtitle }}</h2>
    </div>
    <div class="user-actions">
  <button
    class="user-icon-button"
    aria-label="user profile"
    tabindex="0"
  >
    <img src="../../../assets/images/icons/user_icon.png" alt="User profile" class="user-icon-img" />
  </button>
  <button
    class="logout-icon-button"
    aria-label="logout"
    (click)="logout()"
    tabindex="0"
  >
    <img src="../../../assets/images/icons/logout_icon.png" alt="User profile" class="user-icon-img" />
  </button>
</div>
  </div>
</header>

<header class="header detail" *ngIf="type === 'serviceDetail' || type === 'admin'">
  <img src="../../../assets/images/logos/logo-aspire-multicolor.png" alt="Aspire Logo" class="background" [style.animation-delay]="logoAnimationDelay" />
  <div class="content-wrapper">
    <div class="nav-left">
      <a
        class="home-link"
        (click)="goHome($event)"
        (keyup)="keyGoHome($event)"
        role="button"
        arial-label="Go Home"
        tabindex="0"
      >
        <ss-icon-logo-dark></ss-icon-logo-dark>
      </a>
      <button
        class="back-button"
        aria-label="navigate back"
        (click)="back($event)"
        (keyup)="back($event)"
        tabindex="0"
      >
        <img src="../../../assets/images/icons/back_icon.png" alt="User profile" class="back-button-img" />
      </button>
    </div>
    <div class="text">
      <h1 class="title">{{ headerTitle }}</h1>
    </div>
    <div class="user-actions">
      <button
    class="user-icon-button"
    aria-label="user profile"
    tabindex="0"
  >
    <img src="../../../assets/images/icons/user_icon.png" alt="User profile" class="user-icon-img" />
  </button>
      <button
        class="logout-icon-button"
        aria-label="logout"
        (click)="logout()"
        tabindex="0"
      >
         <img src="../../../assets/images/icons/logout_icon.png" alt="User profile" class="user-icon-img" />
      </button>
    </div>
  </div>
</header>
