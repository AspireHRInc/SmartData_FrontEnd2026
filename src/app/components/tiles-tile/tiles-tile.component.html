
<div class="image-wrapper">
  <img class="image" [src]="imagePath" [alt]="data.name + ' tile image'" (error)="onImageError($event)" />
</div>
<div class="text">
  <div class="status-badges">
    <ss-status-badge
      *ngFor="let tag of data.displayTags"
      [title]="tag.name.toString()"
      [colorFromString]="true"
      [rounded]="true"
    ></ss-status-badge>
  </div>

  <h4 class="title">{{ data.name }}</h4>
  <p class="description">{{ data.shortDescription | slice: 0:75 }}</p>
  <ng-content></ng-content>
</div>
