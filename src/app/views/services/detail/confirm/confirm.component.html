<ss-field-group
  [fields]="serviceSetup.currentServiceFields.Parameters"
  (submit)="onSubmit($event)"
  [static]="true"
  [staticData]="currentSetup"
>
  <kendo-label [for]="comments" text="Comments" class="customizing-label" [formGroup]="formGroup">
    <kendo-textarea #comments formControlName="comment" resizable="none" [rows]="3"></kendo-textarea>
  </kendo-label>
  <ng-container actions></ng-container>
</ss-field-group>
