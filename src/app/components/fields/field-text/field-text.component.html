<div
  class="right"
  *ngIf="!static"
>
  <kendo-label class="label" [text]="parameters.Caption" [formGroup]="formGroup">
    <span class="required" *ngIf="parameters.Required">*</span>
    <kendo-textbox
      [formControlName]="parameters.ParameterName"
      [tabindex]="0"
    ></kendo-textbox>
  </kendo-label>
</div>

<li class="item" *ngIf="static">
  <p class="label">{{ parameters.Caption }}</p>
  <p class="details">{{ parameters.value }}</p>
</li>
