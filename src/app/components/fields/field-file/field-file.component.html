<div
  kendoTooltip
  class="right"
  position="bottom"
  [title]="parameters.HelpText"
  [tooltipTemplate]="template"
  tooltipClass="tool-tip"
  showOn="none"
  #anchor
  *ngIf="!static"
>
  <kendo-label class="label" [formGroup]="formGroup" [text]="parameters.Caption">
    <span class="required" *ngIf="parameters.Required">*</span>
    <!--<button
      class="info"
      [tabindex]="0"
      (click)="toggleToolTip(anchor)"
      [attr.aria-label]="'Field Help ' + parameters.HelpText"
      type="button"
    >
      ?
    </button>-->
    <kendo-upload
      [autoUpload]="false"
      [formControlName]="parameters.ParameterName"
      [multiple]="false"
      [tabindex]="0"
      (focus)="showToolTip(anchor)"
      (blur)="hideToolTip(anchor)"
      (remove)="onFileAbort($event)"
      (cancel)="onFileAbort($event)"
      (select)="onFileSelect($event)"
      (upload)="uploadEventHandler($event)"
    ></kendo-upload>
  </kendo-label>
</div>
<ng-template #template let-anchor>
  <span>{{ parameters.HelpText }}</span>
</ng-template>

<li class="item" *ngIf="static">
  <p class="label">{{ parameters.Caption }}</p>
  <p class="details">{{ parameters.value?.[0]?.name ?? parameters.value ?? '' }}</p>
</li>
